# Refactored VAE Training Configuration - Integrated with New Preprocessing Pipeline

model:
  num_layers: 2
  d_token: 16
  n_head: 1
  factor: 32
  token_bias: true

training:
  batch_size: 512
  num_epochs: 400
  learning_rate: 0.001
  weight_decay: 0
  beta:
    min: 0.001
    max: 0.15
  early_stopping_patience: 400
  scheduler_patience: 10
  scheduler_factor: 0.95

correlation_freq: 5
checkpoint_dir: ckpt
seed: 42 